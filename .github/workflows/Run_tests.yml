name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-chrome:
    runs-on: ubuntu-latest
    name: Chrome Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@latest
      - run: chrome --version

      - name: Run Chrome tests
        run: mvn test -Dbrowser=chrome